<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Velha</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e1e2f, #2b2b45);
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
  }

  h1 {
    margin-bottom: 10px;
    font-size: 2rem;
    letter-spacing: 2px;
  }

  #status {
    margin-bottom: 20px;
    font-size: 1.2rem;
    color: #ffd166;
    min-height: 28px;
  }

  .tabuleiro {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 8px;
  }

  .celula {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    font-weight: bold;
    background: #3a3a5c;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    user-select: none;
  }

  .celula:hover { background: #4a4a75; }
  .celula:active { transform: scale(0.95); }

  .celula.x { color: #4fc3f7; }
  .celula.o { color: #ff6f91; }

  .celula.vencedora {
    background: #2e7d32;
    animation: piscar 0.6s ease-in-out infinite alternate;
  }

  @keyframes piscar {
    from { opacity: 1; }
    to { opacity: 0.6; }
  }

  button {
    margin-top: 25px;
    padding: 12px 30px;
    font-size: 1rem;
    font-weight: bold;
    color: #fff;
    background: #4fc3f7;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  button:hover { background: #29b6f6; }
  button:active { transform: scale(0.96); }
</style>
</head>
<body>

  <h1>JOGO DA VELHA</h1>
  <div id="status">Vez do jogador X</div>

  <div class="tabuleiro" id="tabuleiro"></div>

  <button id="reiniciar">Reiniciar</button>

<script>
  const tabuleiroEl = document.getElementById('tabuleiro');
  const statusEl    = document.getElementById('status');
  const botaoReiniciar = document.getElementById('reiniciar');

  let tabuleiro = Array(9).fill(null);
  let jogadorAtual = 'X';
  let jogoAtivo = true;

  const combinacoes = [
    [0,1,2], [3,4,5], [6,7,8], // linhas
    [0,3,6], [1,4,7], [2,5,8], // colunas
    [0,4,8], [2,4,6]           // diagonais
  ];

  function criarTabuleiro() {
    tabuleiroEl.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const celula = document.createElement('div');
      celula.classList.add('celula');
      celula.dataset.indice = i;
      celula.addEventListener('click', jogar);
      tabuleiroEl.appendChild(celula);
    }
  }

  function jogar(e) {
    const celula = e.target;
    const indice = Number(celula.dataset.indice);

    if (!jogoAtivo || tabuleiro[indice] !== null) return;

    tabuleiro[indice] = jogadorAtual;
    celula.textContent = jogadorAtual;
    celula.classList.add(jogadorAtual.toLowerCase());

    if (verificarVitoria(jogadorAtual)) {
      statusEl.textContent = `🎉 Jogador ${jogadorAtual} venceu!`;
      jogoAtivo = false;
      destacarVitoria(jogadorAtual);
      return;
    }

    if (tabuleiro.every(c => c !== null)) {
      statusEl.textContent = '🤝 Empate!';
      jogoAtivo = false;
      return;
    }

    jogadorAtual = jogadorAtual === 'X' ? 'O' : 'X';
    statusEl.textContent = `Vez do jogador ${jogadorAtual}`;
  }

  function verificarVitoria(j) {
    return combinacoes.some(comb =>
      comb.every(i => tabuleiro[i] === j)
    );
  }

  function destacarVitoria(j) {
    combinacoes.forEach(comb => {
      if (comb.every(i => tabuleiro[i] === j)) {
        comb.forEach(i => {
          tabuleiroEl.children[i].classList.add('vencedora');
        });
      }
    });
  }

  function reiniciar() {
    tabuleiro = Array(9).fill(null);
    jogadorAtual = 'X';
    jogoAtivo = true;
    statusEl.textContent = 'Vez do jogador X';
    criarTabuleiro();
  }

  botaoReiniciar.addEventListener('click', reiniciar);

  criarTabuleiro();
</script>

</body>
</html>
